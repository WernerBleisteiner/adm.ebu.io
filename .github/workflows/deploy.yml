name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install -r requirements.txt

      - run: mkdocs build

      - name: Create ADM Profiles and Levels Labels Table
        # If Labels.xml is no longer available, contact SMPTE 30MR for assistance or change to using the latest publication of SMPTE ST 2123 at https://pub.smpte.org/doc/st2123/
        # This step overwrites adm_profiles_levels_table.html with a file generated from the latest data. A fallback option is to skip this step and just use the (potentially out-of-date) adm_profiles_levels_table.html included in this repo.
        run: |
          sudo apt-get update
          sudo apt-get install xsltproc
          wget https://registry.smpte-ra.org/view/draft/Labels.xml
          xsltproc -o ./site/best_practices/adm_profiles_levels_table.html ./adm_profiles_levels_table/LabelsRegisterToADMTable.xsl ./Labels.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
