        - ADM Plugfests:
            - 1st Plugfest: 'admig/plugfest1.md'
            - 2nd Plugfest: 'admig/plugfest2.md'
        - Webinars: 'documents/webinars.md'
        - Events:
            - Past Events: 'admig/past_events.md'
            - ADM-IG@EBU@IBC2026: 'admig/ibc2026.md'
            - Future Events: 'admig/future_events.md'
  - Acknowledgements: 'admig/acknowledgements.md'
